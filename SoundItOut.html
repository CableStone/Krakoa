    .twk-hd{display:flex;align-items:center;justify-content:space-between;

    .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;

      background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}

  function useTweaks(defaults) {
    const [values, setValues] = React.useState(defaults);
    const setTweak = React.useCallback((keyOrEdits, val) => {
      const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
      setValues((prev) => ({ ...prev, ...edits }));
    }, []);
    return [values, setTweak];
  }

  function TweaksPanel({ title = 'Tweaks', children }) {
    const [open, setOpen] = React.useState(false);
    const dragRef = React.useRef(null);
    const offsetRef = React.useRef({ x: 16, y: 16 });
    const PAD = 16;

    const clampToViewport = React.useCallback(() => {
      const panel = dragRef.current;
      if (!panel) return;
      const w = panel.offsetWidth, h = panel.offsetHeight;
      offsetRef.current = {
        x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
        y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
      };
      panel.style.right = offsetRef.current.x + 'px';
      panel.style.bottom = offsetRef.current.y + 'px';
    }, []);

    React.useEffect(() => {
      const onMsg = (e) => {
        const t = e?.data?.type;
        if (t === '__activate_edit_mode') setOpen(true);
        else if (t === '__deactivate_edit_mode') setOpen(false);
      };
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      return () => window.removeEventListener('message', onMsg);
    }, []);

    const onDragStart = (e) => {
      const panel = dragRef.current;
      if (!panel) return;
      const r = panel.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const startRight = window.innerWidth - r.right;
      const startBottom = window.innerHeight - r.bottom;
      const move = (ev) => {
        offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
        clampToViewport();
      };
      const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    };

    if (!open) return null;
    return (
      <>
        <style>{__TWEAKS_STYLE}</style>
        <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={() => setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      </>
    );
  }

  function TweakSection({ label }) {
    return <div className="twk-sect">{label}</div>;
  }

  function TweakToggle({ label, value, onChange }) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
                role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
      </div>
    );
  }

  function TweakRadio({ label, value, options, onChange }) {
    const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
    const idx = Math.max(0, opts.findIndex((o) => o.value === value));
    const n = opts.length;
    return (
      <div className="twk-row">
        <div className="twk-lbl"><span>{label}</span></div>
        <div className="twk-seg" role="radiogroup">
          <div className="twk-seg-thumb"
               style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
          {opts.map((o) => (
            <button key={o.value} type="button" role="radio" aria-checked={o.value === value}
                    onClick={() => onChange(o.value)}>{o.label}</button>
          ))}
        </div>
      </div>
    );
  }

  function IOSStatusBar({ dark = false }) {

  // ─────────────────────────────────────────────────────────────

  function PaperUpload({ dark, density, onTranslate, onSettings, onPickRecent, onHistory }) {
    const t = paperTokens(dark);
    const pad = density === 'compact' ? 14 : 20;

    const [scan, setScan] = React.useState(0.3);
    React.useEffect(() => {
      let r, t0 = performance.now();
      const tick = (now) => { setScan(((now - t0) / 2400) % 1); r = requestAnimationFrame(tick); };
      r = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(r);
    }, []);

    return (
      <div style={{ width: '100%', height: '100%', background: t.bg, color: t.ink, fontFamily: PFont.body, display: 'flex', flexDirection: 'column' }}>
        <PaperHeader t={t} label="01 · CAPTURE" title="What did you find?"

            <PaperIconButton t={t} onClick={onSettings} aria-label="Settings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">

                <circle cx="12" cy="12" r="3"/>
              </svg>
            </PaperIconButton>
          }
        />

          {/* Reading options */}
          <div>
            <div style={{ fontFamily: PFont.mono, fontSize: 10, letterSpacing: 1.4, color: t.muted, textTransform: 'uppercase', marginBottom: 10 }}>Reading</div>
            <div style={{ background: t.card, border: `1px solid ${t.hair}`, borderRadius: 18, padding: '4px 0' }}>
              {[['Show Hebrew vowel points (niqqud)', true], ['Auto-play audio on tap', false], ['Save to history', true]].map(([label, on], i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: `${density === 'compact' ? 12 : 16}px 18px`, borderBottom: i < 2 ? `1px solid ${t.hair}` : 'none' }}>
                  <span style={{ fontSize: 14, color: t.ink }}>{label}</span>
                  <div style={{ width: 38, height: 22, borderRadius: 11, background: on ? t.accent : t.faint, position: 'relative', cursor: 'pointer' }}>
                    <div style={{ position: 'absolute', top: 2, left: on ? 18 : 2, width: 18, height: 18, borderRadius: 9, background: '#fff', transition: 'left .15s' }}/>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ fontFamily: PFont.display, fontStyle: 'italic', fontSize: 13, color: t.muted, textAlign: 'center', padding: '14px 20px', lineHeight: 1.5 }}>
            "Pronunciation is a thread that runs through generations."
          </div>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // SCREEN 5 — HISTORY
  // ─────────────────────────────────────────────────────────────
  function PaperHistory({ dark, density, onBack, onOpen }) {
    const t = paperTokens(dark);
    const pad = density === 'compact' ? 10 : 14;

    const groups = [];
    HISTORY.forEach((item, idx) => {
      let g = groups.find((x) => x.label === item.dateLabel);
      if (!g) { g = { label: item.dateLabel, items: [] }; groups.push(g); }
      g.items.push({ ...item, idx });
    });

    return (
      <div style={{ width: '100%', height: '100%', background: t.bg, color: t.ink, fontFamily: PFont.body, overflow: 'auto' }}>
        <PaperHeader t={t} label="LIBRARY" title="History" onBack={onBack}
          trailing={
            <PaperIconButton t={t} aria-label="Search">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
                <circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/>
              </svg>
            </PaperIconButton>
          }
        />

        {/* Stats */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, margin: '6px 24px 18px', background: t.hair, border: `1px solid ${t.hair}`, borderRadius: 14, overflow: 'hidden' }}>
          {[['Captures', HISTORY.length], ['Words', HISTORY.reduce((s, h) => s + h.words, 0)], ['Saved', 4]].map(([k, v]) => (
            <div key={k} style={{ background: t.card, padding: '12px 14px' }}>
              <div style={{ fontFamily: PFont.mono, fontSize: 9, letterSpacing: 1.2, color: t.muted, textTransform: 'uppercase' }}>{k}</div>
              <div style={{ fontFamily: PFont.display, fontSize: 28, lineHeight: 1, color: t.ink, marginTop: 6, letterSpacing: -0.5 }}>{v}</div>
            </div>
          ))}
        </div>

        {/* Filter chips */}
        <div style={{ display: 'flex', gap: 6, padding: '0 24px 14px', overflowX: 'auto' }}>
          {['All', 'iMessage', 'WhatsApp', 'Photos', 'Maps', 'Saved'].map((f, i) => (
            <button key={f} style={{ border: i === 0 ? 'none' : `1px solid ${t.hair}`, background: i === 0 ? t.ink : 'transparent', color: i === 0 ? t.bg : t.muted, fontFamily: PFont.mono, fontSize: 10, letterSpacing: 1, textTransform: 'uppercase', padding: '6px 12px', borderRadius: 999, cursor: 'pointer', flexShrink: 0 }}>{f}</button>
          ))}
        </div>

        {/* Timeline */}
        {groups.map((g) => (
          <div key={g.label} style={{ marginBottom: 18 }}>
            <div style={{ padding: '6px 24px 10px', display: 'flex', alignItems: 'baseline', gap: 10 }}>
              <div style={{ fontFamily: PFont.display, fontStyle: 'italic', fontSize: 20, color: t.ink }}>{g.label}</div>
              <div style={{ flex: 1, height: 1, background: t.hair }}/>
              <div style={{ fontFamily: PFont.mono, fontSize: 10, color: t.faint, letterSpacing: 0.5 }}>{g.items.length}</div>
            </div>
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {g.items.map((h) => {
                const src = SOURCE_META[h.source] || { color: t.faint, tag: '·' };
                return (
                  <button key={h.idx} onClick={() => onOpen && onOpen(h.idx)} style={{ display: 'block', width: '100%', textAlign: 'left', background: t.card, border: `1px solid ${t.hair}`, borderRadius: 16, padding: pad + 4, cursor: 'pointer', fontFamily: 'inherit', color: 'inherit' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontFamily: PFont.mono, fontSize: 10, color: t.muted, letterSpacing: 1, textTransform: 'uppercase' }}>
                        <span style={{ width: 18, height: 18, borderRadius: 4, background: src.color, color: '#fff', fontSize: 8, fontWeight: 600, letterSpacing: 0.3, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{src.tag}</span>
                        <span>{h.source}</span>
                      </div>
                      <div style={{ fontFamily: PFont.mono, fontSize: 10, color: t.faint, letterSpacing: 0.4 }}>{h.when.toUpperCase()}</div>
                    </div>
                    <div style={{ fontFamily: PFont.he, fontSize: 26, direction: 'rtl', color: t.ink, lineHeight: 1.2, marginBottom: 6, fontWeight: 500 }}>{h.he}</div>
                    <div style={{ fontFamily: PFont.display, fontStyle: 'italic', fontSize: 15, color: t.ink, lineHeight: 1.3, marginBottom: 8 }}>"{h.gloss}"</div>
                    <div style={{ fontFamily: PFont.mono, fontSize: 11, color: t.accent, letterSpacing: 0.4, marginBottom: 10 }}>{h.translit}</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: 10, borderTop: `1px solid ${t.hair}` }}>
                      <div style={{ fontSize: 12, color: t.muted, lineHeight: 1.3, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: 1, minWidth: 0, marginRight: 10 }}>{h.context}</div>
                      <div style={{ fontFamily: PFont.mono, fontSize: 10, color: t.faint, letterSpacing: 0.5, flexShrink: 0 }}>{h.words} {h.words === 1 ? 'word' : 'words'}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        ))}

        <div style={{ fontFamily: PFont.display, fontStyle: 'italic', fontSize: 13, color: t.muted, textAlign: 'center', padding: '8px 32px 40px', lineHeight: 1.5 }}>
          "Every phrase you've captured, kept in one place."
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // OVERLAY — SYLLABLE PRACTICE
  // ─────────────────────────────────────────────────────────────
  function PaperPractice({ dark, density, phonetic = 'simple', wordIdx, onClose }) {
    const t = paperTokens(dark);
    const word = SAMPLE_PHRASE.words[wordIdx];
    const total = word.syllables.length;

    const [syll, setSyll] = React.useState(0);
    const [drag, setDrag] = React.useState(0);
    const [enter, setEnter] = React.useState(false);

    React.useEffect(() => { requestAnimationFrame(() => setEnter(true)); }, []);
    React.useEffect(() => { setSyll(0); }, [wordIdx]);

    const ref = React.useRef(null);
    const dragRef = React.useRef({ active: false, startX: 0, w: 0 });

    const goto = (i) => setSyll(Math.max(0, Math.min(total - 1, i)));

    const onPointerDown = (e) => {
      if (e.target.closest('[data-no-drag]')) return;
      dragRef.current = { active: true, startX: e.clientX, w: ref.current ? ref.current.offsetWidth : 320 };
      e.currentTarget.setPointerCapture(e.pointerId);
    };
    const onPointerMove = (e) => { if (!dragRef.current.active) return; setDrag(e.clientX - dragRef.current.startX); };
    const onPointerUp = () => {
      if (!dragRef.current.active) return;
      const dx = drag;
      dragRef.current.active = false;
      setDrag(0);
      if (Math.abs(dx) > dragRef.current.w * 0.18) goto(syll + (dx < 0 ? 1 : -1));
    };

    const s = word.syllables[syll];
    const showSimple = phonetic === 'simple' || phonetic === 'both';
    const showIpa    = phonetic === 'ipa'    || phonetic === 'both';

    const heSpans = word.syllables.map((sy, i) => (
      <span key={i} style={{ color: i === syll ? t.accent : t.faint, transition: 'color .25s', borderBottom: i === syll ? `2px solid ${t.accent}` : '2px solid transparent', paddingBottom: 4 }}>{sy.chars}</span>
    ));

    return (
      <div style={{ position: 'absolute', inset: 0, zIndex: 80, background: 'rgba(26,23,20,0.45)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', opacity: enter ? 1 : 0, transition: 'opacity .25s', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }} onClick={onClose}>
        <div onClick={(e) => e.stopPropagation()} style={{ background: t.bg, color: t.ink, fontFamily: PFont.body, borderTopLeftRadius: 28, borderTopRightRadius: 28, padding: '14px 0 30px', transform: enter ? 'translateY(0)' : 'translateY(40px)', transition: 'transform .35s cubic-bezier(.2,.7,.2,1)', boxShadow: '0 -20px 60px rgba(0,0,0,0.18)', display: 'flex', flexDirection: 'column', gap: 18 }}>
          {/* Grabber */}
          <div style={{ width: 40, height: 4, borderRadius: 2, background: t.faint, alignSelf: 'center', margin: '4px 0 2px' }}/>

          {/* Header */}
          <div style={{ padding: '0 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontFamily: PFont.mono, fontSize: 10, letterSpacing: 1.4, color: t.muted, textTransform: 'uppercase' }}>PRACTICE · {String(syll + 1).padStart(2,'0')} / {String(total).padStart(2,'0')}</div>
              <div style={{ fontFamily: PFont.display, fontSize: 26, color: t.ink, marginTop: 4, lineHeight: 1, letterSpacing: -0.3 }}>{word.gloss}</div>
            </div>
            <button data-no-drag onClick={onClose} aria-label="Close" style={{ width: 32, height: 32, borderRadius: 16, border: `1px solid ${t.hair}`, background: 'transparent', color: t.ink, cursor: 'pointer', padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M2 2l7 7M9 2l-7 7"/></svg>
            </button>
          </div>

          {/* Hebrew word with highlighted syllable */}
          <div style={{ direction: 'rtl', textAlign: 'center', padding: '6px 24px', fontFamily: PFont.he, fontSize: 52, lineHeight: 1, color: t.faint, letterSpacing: -1 }}>{heSpans}</div>

          {/* Carousel */}
          <div ref={ref} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} style={{ position: 'relative', height: 168, overflow: 'hidden', touchAction: 'pan-y', cursor: dragRef.current.active ? 'grabbing' : 'grab', userSelect: 'none' }}>
            <div style={{ position: 'absolute', inset: 0, transform: `translateX(${-syll * 100}%) translateX(${drag}px)`, transition: dragRef.current.active ? 'none' : 'transform .35s cubic-bezier(.2,.7,.2,1)', display: 'flex' }}>
              {word.syllables.map((sy, i) => (
                <div key={i} style={{ flex: '0 0 100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 24px', gap: 8 }}>
                  <div style={{ fontFamily: PFont.he, fontSize: 64, lineHeight: 1, color: t.ink, direction: 'rtl', letterSpacing: -1 }}>{sy.chars}</div>
                  {showSimple && (
                    <div style={{ fontFamily: PFont.mono, fontSize: 24, letterSpacing: 1, color: i === word.stress ? t.accent : t.ink, fontWeight: i === word.stress ? 600 : 400 }}>
                      {sy.simple.toLowerCase()}
                      {i === word.stress && <span style={{ fontSize: 12, marginLeft: 6, verticalAlign: 'middle', color: t.accent, fontWeight: 400 }}>· stress</span>}
                    </div>
                  )}
                  {showIpa && <div style={{ fontFamily: PFont.mono, fontSize: showSimple ? 14 : 22, color: t.muted, letterSpacing: 0.5 }}>/{sy.ipa}/</div>}
                </div>
              ))}
            </div>
            {syll > 0 && <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 36, background: `linear-gradient(to right, ${t.bg}, transparent)`, pointerEvents: 'none' }}/>}
            {syll < total - 1 && <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: 36, background: `linear-gradient(to left, ${t.bg}, transparent)`, pointerEvents: 'none' }}/>}
          </div>

          {/* Dots */}
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center', alignItems: 'center', padding: '0 24px' }} data-no-drag>
            {word.syllables.map((_, i) => (
              <button key={i} onClick={() => goto(i)} aria-label={`Syllable ${i+1}`} style={{ border: 'none', background: 'transparent', padding: 4, cursor: 'pointer' }}>
                <div style={{ width: i === syll ? 22 : 6, height: 6, borderRadius: 3, background: i === syll ? t.accent : t.faint, transition: 'width .25s, background .25s' }}/>
              </button>
            ))}
          </div>

          {/* Controls */}
          <div style={{ padding: '4px 24px', display: 'flex', gap: 10, alignItems: 'center' }} data-no-drag>
            <button onClick={() => goto(syll - 1)} disabled={syll === 0} aria-label="Previous" style={{ width: 48, height: 48, borderRadius: 24, border: `1px solid ${t.hair}`, background: 'transparent', color: syll === 0 ? t.faint : t.ink, cursor: syll === 0 ? 'default' : 'pointer', padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M9 2L4 7l5 5"/></svg>
            </button>
            <button aria-label="Play" style={{ flex: 1, height: 48, borderRadius: 24, border: 'none', background: t.accent, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, fontFamily: PFont.body, fontSize: 14, fontWeight: 500, letterSpacing: 0.2 }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2v10l7-5z"/></svg>
              Hear "{showSimple ? s.simple.toLowerCase() : s.ipa}"
            </button>
            <button onClick={() => goto(syll + 1)} disabled={syll === total - 1} aria-label="Next" style={{ width: 48, height: 48, borderRadius: 24, border: `1px solid ${t.hair}`, background: 'transparent', color: syll === total - 1 ? t.faint : t.ink, cursor: syll === total - 1 ? 'default' : 'pointer', padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5 2l5 5-5 5"/></svg>
            </button>
          </div>

          {/* Hint */}
          <div style={{ fontFamily: PFont.display, fontStyle: 'italic', fontSize: 13, color: t.muted, textAlign: 'center', padding: '0 24px' }}>
            {syll === total - 1
              ? <>Now try the whole word: <span style={{ color: t.accent }}>{word.simple.toLowerCase()}</span></>
              : 'Swipe ← to advance · or use the arrows'}
          </div>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // APP SHELL
  // ─────────────────────────────────────────────────────────────
  const TWEAK_DEFAULTS = { dark: false, density: 'comfortable', phonetic: 'simple' };

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const { dark, density, phonetic } = t;
    const setPhonetic = (v) => setTweak('phonetic', v);

    const [screen, setScreen] = React.useState('upload');
    const [prevScreen, setPrevScreen] = React.useState('upload');
    const [activeWord, setActiveWord] = React.useState(1);
    const [practiceWord, setPracticeWord] = React.useState(null);

    const go = (next) => { setPrevScreen(screen); setScreen(next); };
    const back = () => setScreen(prevScreen === screen ? 'upload' : prevScreen);

    const bg = dark ? '#0E0C09' : '#EDE8DD';

    return (
      <React.Fragment>
        <div style={{ minHeight: '100vh', width: '100%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32, boxSizing: 'border-box', fontFamily: '"Geist", -apple-system, system-ui, sans-serif', position: 'relative', backgroundImage: dark ? 'radial-gradient(circle at 30% 20%, rgba(184,92,64,0.06) 0%, transparent 50%)' : 'radial-gradient(circle at 30% 20%, rgba(184,92,64,0.05) 0%, transparent 50%)' }}>
          <div style={{ position: 'relative', flexShrink: 0 }}>
            <IOSDevice width={390} height={844} dark={dark}>
              <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
                {screen === 'upload' && (
                  <PaperUpload dark={dark} density={density}
                    onTranslate={() => go('result')}
                    onSettings={() => go('settings')}
                    onPickRecent={() => go('result')}
                    onHistory={() => go('history')}
                  />
                )}
                {screen === 'result' && (
                  <PaperResult dark={dark} density={density}
                    phonetic={phonetic} setPhonetic={setPhonetic}
                    active={activeWord} setActive={setActiveWord}
                    onBack={() => go('upload')}
                    onLookup={() => go('dict')}
                    onPractice={(i) => { setActiveWord(i); setPracticeWord(i); }}
                  />
                )}
                {screen === 'dict' && (
                  <PaperDictionary dark={dark} density={density} onBack={() => go('result')}/>
                )}
                {screen === 'settings' && (
                  <PaperSettings dark={dark} density={density}
                    phonetic={phonetic} setPhonetic={setPhonetic}
                    onBack={() => go(prevScreen)}/>
                )}
                {screen === 'history' && (
                  <PaperHistory dark={dark} density={density}
                    onBack={() => go('upload')}
                    onOpen={() => go('result')} />
                )}
                {practiceWord !== null && (
                  <PaperPractice dark={dark} density={density}
                    phonetic={phonetic} wordIdx={practiceWord}
                    onClose={() => setPracticeWord(null)} />
                )}
              </div>
            </IOSDevice>

            {/* Screen label */}
            <div style={{ position: 'absolute', top: -36, left: 0, fontFamily: '"Geist Mono", ui-monospace, monospace', fontSize: 10, letterSpacing: 1.4, textTransform: 'uppercase', color: dark ? 'rgba(242,237,227,0.45)' : 'rgba(26,23,20,0.45)' }}>
              SoundItOut · {{ upload: '01 Capture', result: '02 Result', dict: '03 Dictionary', settings: '04 Settings', history: '05 History' }[screen]}
            </div>

            {/* Step pills */}
            <div style={{ position: 'absolute', top: -36, right: 0, display: 'flex', gap: 6 }}>
              {[['upload','01'],['result','02'],['dict','03'],['settings','04'],['history','05']].map(([k, n]) => (
                <button key={k} onClick={() => go(k)} aria-label={k} style={{ border: 'none', background: 'transparent', cursor: 'pointer', fontFamily: '"Geist Mono", ui-monospace, monospace', fontSize: 10, letterSpacing: 1, padding: '4px 8px', borderRadius: 999, color: screen === k ? '#B85C40' : (dark ? 'rgba(242,237,227,0.45)' : 'rgba(26,23,20,0.45)'), background: screen === k ? (dark ? 'rgba(184,92,64,0.15)' : 'rgba(184,92,64,0.10)') : 'transparent' }}>{n}</button>
              ))}
            </div>
          </div>
        </div>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Theme" />
          <TweakToggle label="Dark mode" value={dark} onChange={(v) => setTweak('dark', v)} />
          <TweakSection label="Layout" />
          <TweakRadio label="Density" value={density} options={['compact', 'comfortable']} onChange={(v) => setTweak('density', v)} />
          <TweakSection label="Phonetics" />
          <TweakRadio label="Style" value={phonetic} options={['simple', 'both', 'ipa']} onChange={(v) => setTweak('phonetic', v)} />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
